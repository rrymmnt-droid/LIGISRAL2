    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: radial-gradient(circle at top center, #1a233a 0%, #080a0f 100%);
            color: #f1f5f9;
            min-height: 100vh;
            user-select: none;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(18, 24, 38, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease-in-out;
        }

        .glass-card:hover {
            border-color: rgba(0, 255, 136, 0.3);
            transform: translateY(-2px);
        }

        /* Pitch Grass Styling */
        .football-pitch {
            background: radial-gradient(circle, #1b432c 0%, #0d2818 100%);
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .pitch-line {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.25);
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 136, 0.4);
        }

        .glow-green {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }
        
        .selected-swap {
            animation: pulse-ring 1.2s infinite;
            border-color: #00ff88 !important;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>

                if (state.selectedPitchIndex === index) {

                    const temp = state.startingXI[state.selectedPitchIndex];
                    state.startingXI[state.selectedPitchIndex] = state.startingXI[index];
                    state.startingXI[index] = temp;
                    state.selectedPitchIndex = null;

                const temp = state.startingXI[index];
                state.startingXI[index] = state.bench[state.selectedBenchIndex];
                state.bench[state.selectedBenchIndex] = temp;
                state.selectedBenchIndex = null;
            }
            render();
        }

                state.bench[index] = temp;

            } else {

        function editPlayerNumber(playerId) {
            const player = state.squad.find(p => p.id === playerId);
            if (!player) return;
            const newNum = prompt(`הזן מספר חולצה חדש עבור ${player.name} (1-99):`, player.num);
            if (newNum !== null) {
                const parsed = parseInt(newNum, 10);
                if (!isNaN(parsed) && parsed >= 1 && parsed <= 99) {
                    player.num = parsed;
                    // Update reference in XI and bench
                    const inXI = state.startingXI.find(p => p.id === playerId);
                    if (inXI) inXI.num = parsed;
                    const inBench = state.bench.find(p => p.id === playerId);
                    if (inBench) inBench.num = parsed;
                    render();
                } else {
                    alert('אנא הזן מספר תקין בין 1 ל-99');
                }
            }
        }

        function buyPlayer(playerId) {
            const marketIndex = state.market.findIndex(p => p.id === playerId);
            if (marketIndex === -1) return;

            const player = state.market[marketIndex];
            
            // Check budget
            if (state.budget < player.val) {
                alert('אין למועדון מספיק תקציב לרכישת שחקן זה!');
                return;
            }

            // Check duplicate
            if (state.squad.some(p => p.id === player.id)) {
                alert('שחקן זה כבר קיים בסגל שלך!');
                return;
            }

            // Deduct funds and add player
            state.budget -= player.val;
            const newPlayer = { ...player };
            delete newPlayer.clubName;

            state.squad.push(newPlayer);
            state.bench.push(newPlayer); // Adds to bench

            // Remove from market completely
            state.market.splice(marketIndex, 1);

            alert(`ברכות! השחקן ${player.name} נרכש בהצלחה על ידי ${state.userClub.name}!`);
            render();
        }

        function sellPlayer(playerId) {
            if (state.squad.length <= 11) {
                alert('לא ניתן למכור שחקנים! הסגל חייב להכיל לפחות 11 שחקנים.');
                return;
            }

            const squadIndex = state.squad.findIndex(p => p.id === playerId);
            if (squadIndex === -1) return;

            const player = state.squad[squadIndex];

            // Remove from Squad
            state.squad.splice(squadIndex, 1);

            // Remove from Starting XI or Bench
            const xiIndex = state.startingXI.findIndex(p => p.id === playerId);
            if (xiIndex !== -1) {
                // If removed from XI, promote first bench player
                state.startingXI.splice(xiIndex, 1);
                if (state.bench.length > 0) {
                    state.startingXI.push(state.bench.shift());
                }
            } else {
                const benchIndex = state.bench.findIndex(p => p.id === playerId);
                if (benchIndex !== -1) {
                    state.bench.splice(benchIndex, 1);
                }
            }

            // Add value to Budget
            state.budget += player.val;

            // Return to market
            state.market.push({
                ...player,
                clubName: 'שחקן חופשי'
            });

            alert(`השחקן ${player.name} נמכר בהצלחה תמורת ₪${player.val.toLocaleString()}!`);
            render();
        }

        function startMatchSimulation() {
            if (state.matchSim.inProgress) return;

            // Pick random opponent
            const otherTeams = Object.keys(TEAMS_DATABASE).filter(k => k !== state.userClubKey);
            const opponentKey = otherTeams[Math.floor(Math.random() * otherTeams.length)];
            const opponentData = TEAMS_DATABASE[opponentKey];

            state.matchSim = {
                inProgress: true,
                homeTeam: state.userClub.name,
                awayTeam: opponentData.name,
                homeGoals: 0,
                awayGoals: 0,
                events: [],
                timer: 0
            };

            render();

            const interval = setInterval(() => {
                state.matchSim.timer += 5;

                // Event check
                if (Math.random() < 0.35 && state.matchSim.timer <= 90) {
                    const isHome = Math.random() > 0.45;
                    const teamName = isHome ? state.matchSim.homeTeam : state.matchSim.awayTeam;
                    
                    let scorerName = "שחקן התקפה";
                    
                    if (isHome) {
                        // Filter user squad - EXCLUDE GOALKEEPERS (GK)
                        const outfieldPlayers = state.startingXI.filter(p => p.pos !== 'GK');
                        if (outfieldPlayers.length > 0) {
                            const scorer = outfieldPlayers[Math.floor(Math.random() * outfieldPlayers.length)];
                            scorerName = scorer.name;
                        } else {
                            scorerName = "חלוץ";
                        }
                        state.matchSim.homeGoals++;
                    } else {
                        // Filter opponent roster - EXCLUDE GOALKEEPERS (GK)
                        const outfieldOpponents = opponentData.roster.filter(p => p.pos !== 'GK');
                        if (outfieldOpponents.length > 0) {
                            const scorer = outfieldOpponents[Math.floor(Math.random() * outfieldOpponents.length)];
                            scorerName = scorer.name;
                        } else {
                            scorerName = "שחקן יריבה";
                        }
                        state.matchSim.awayGoals++;
                    }

                    state.matchSim.events.unshift({
                        minute: state.matchSim.timer,
                        text: `⚽ שער! ${scorerName} הבקיע עבור ${teamName}! (${state.matchSim.homeGoals} - ${state.matchSim.awayGoals})`
                    });
                }

                if (state.matchSim.timer >= 90) {
                    clearInterval(interval);
                    state.matchSim.inProgress = false;
                    state.matchSim.events.unshift({
                        minute: 90,
                        text: `🏁 שריקת הסיום! התוצאה הסופית: ${state.matchSim.homeTeam} ${state.matchSim.homeGoals} - ${state.matchSim.awayGoals} ${state.matchSim.awayTeam}`
                    });

                    // Update standings
                    updateStandingsAfterMatch(state.matchSim.homeTeam, state.matchSim.awayTeam, state.matchSim.homeGoals, state.matchSim.awayGoals);
                    state.currentRound++;
                }

                render();
            }, 300);
        }

        function updateStandingsAfterMatch(homeName, awayName, homeG, awayG) {
            const homeEntry = state.standings.find(s => s.name === homeName);
            const awayEntry = state.standings.find(s => s.name === awayName);

            if (homeEntry && awayEntry) {
                homeEntry.played++;
                awayEntry.played++;
                homeEntry.gf += homeG;
                homeEntry.ga += awayG;
                homeEntry.gd = homeEntry.gf - homeEntry.ga;

                awayEntry.gf += awayG;
                awayEntry.ga += homeG;
                awayEntry.gd = awayEntry.gf - awayEntry.ga;

                if (homeG > awayG) {
                    homeEntry.wins++;
                    homeEntry.pts += 3;
                    awayEntry.losses++;
                } else if (homeG < awayG) {
                    awayEntry.wins++;
                    awayEntry.pts += 3;
                    homeEntry.losses++;
                } else {
                    homeEntry.draws++;
                    homeEntry.pts += 1;
                    awayEntry.draws++;
                    awayEntry.pts += 1;
                }

                // Sort standings
                state.standings.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
            }
        }

                            </button>
                        </div>
                    </div>

                    <!-- Card 3: Top Squad Players -->
                    <div class="glass-panel p-5 rounded-xl border border-slate-800">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-slate-200">כוכבי הקבוצה</h3>
                            <i class="fas fa-star text-yellow-400 text-xl"></i>
                        </div>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${[...state.squad].sort((a,b) => b.overall - a.overall).slice(0, 4).map(p => `
                                <div class="flex justify-between items-center p-2 rounded-lg bg-slate-900/50 text-xs">
                                    <div class="flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-slate-800 text-slate-300 font-bold flex items-center justify-center">${p.num}</span>
                                        <span class="font-semibold text-white">${p.name}</span>
                                    </div>
                                    <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-black">${p.overall} OVR</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTacticsTab() {
            const formPositions = FORMATIONS[state.formation];
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Visual Pitch Layout -->
                    <div class="lg:col-span-2 glass-panel p-4 rounded-xl border border-slate-800 flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center gap-3">
                                <h3 class="font-bold text-slate-200">מערך טקטי</h3>
                                <select onchange="state.formation = this.value; render();" class="bg-slate-900 text-white text-xs border border-slate-700 rounded-lg p-1.5 font-bold focus:outline-none">
                                    <option value="4-3-3" ${state.formation === '4-3-3' ? 'selected' : ''}>4-3-3</option>
                                    <option value="4-2-3-1" ${state.formation === '4-2-3-1' ? 'selected' : ''}>4-2-3-1</option>
                                    <option value="3-5-2" ${state.formation === '3-5-2' ? 'selected' : ''}>3-5-2</option>
                                </select>
                            </div>
                            <span class="text-xs text-slate-400">לחץ על שחקנים בהרכב/ספסל כדי להחליף ביניהם</span>
                        </div>

                        <!-- Football Pitch Graphic -->
                        <div class="football-pitch w-full h-[480px] rounded-xl relative">
                            <!-- Pitch Lines -->
                            <div class="pitch-line top-1/2 left-0 right-0 border-t"></div>
                            <div class="pitch-line top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 rounded-full border"></div>
                            <div class="pitch-line bottom-0 left-1/2 -translate-x-1/2 w-48 h-20 border-t border-x"></div>
                            <div class="pitch-line top-0 left-1/2 -translate-x-1/2 w-48 h-20 border-b border-x"></div>

                            <!-- Starting XI Player Tokens on Pitch -->
                            ${state.startingXI.map((player, idx) => {
                                const posCoord = formPositions[idx] || { x: 50, y: 50 };
                                const isSelected = state.selectedPitchIndex === idx;
                                return `
                                    <div onclick="handlePitchPlayerClick(${idx})" 
                                         style="left: ${posCoord.x}%; top: ${posCoord.y}%; transform: translate(-50%, -50%);"
                                         class="absolute cursor-pointer flex flex-col items-center group transition ${isSelected ? 'selected-swap' : ''}">
                                        
                                        <div class="relative w-9 h-9 rounded-full bg-slate-950 border-2 ${isSelected ? 'border-ea-green' : 'border-amber-400'} flex items-center justify-center shadow-lg group-hover:scale-110 transition">
                                            <span class="text-amber-300 font-black text-xs">${player.num}</span>
                                            <span class="absolute -top-1 -right-1 px-1 bg-slate-800 text-[9px] font-bold text-ea-green rounded border border-slate-700">${player.pos}</span>
                                        </div>

                                        <div class="mt-1 bg-slate-950/80 px-2 py-0.5 rounded text-[10px] font-bold text-white border border-slate-800 shadow whitespace-nowrap">
                                            ${player.name}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Bench & Jersey Number Editing Sidebar -->
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 flex flex-col">
                        <h3 class="font-bold text-slate-200 mb-3">ספסל החלפות ושחקנים</h3>
                        
                        <div class="flex-1 overflow-y-auto space-y-2 max-h-[480px] pr-1">
                            ${state.bench.map((player, idx) => {
                                const isSelected = state.selectedBenchIndex === idx;
                                return `
                                    <div class="p-2.5 rounded-lg border transition flex items-center justify-between ${isSelected ? 'bg-ea-green/10 border-ea-green' : 'bg-slate-900/60 border-slate-800 hover:border-slate-700'}">
                                        
                                        <div onclick="handleBenchPlayerClick(${idx})" class="flex items-center gap-3 cursor-pointer flex-1">
                                            <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-xs text-amber-300">
                                                ${player.num}
                                            </div>
                                            <div>
                                                <div class="text-xs font-bold text-white">${player.name}</div>
                                                <div class="text-[10px] text-slate-400">${player.pos} • OVR: ${player.overall}</div>
                                            </div>
                                        </div>

                                        <button onclick="editPlayerNumber('${player.id}')" title="שנה מספר חולצה" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] rounded border border-slate-700">
                                            <i class="fas fa-tshirt text-ea-green ml-1"></i> שנה מספר
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTransfersTab() {
            return `
                <div class="space-y-6">
                    <!-- Transfer Tab Switcher -->
                    <div class="flex gap-4 border-b border-slate-800 pb-3">
                        <h3 class="font-bold text-lg text-white">חלון העברות רשמי</h3>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Buy Players Market -->
                        <div class="glass-panel p-4 rounded-xl border border-slate-800">
                            <h4 class="font-bold text-ea-green mb-3 flex items-center justify-between">
                                <span><i class="fas fa-shopping-cart ml-1"></i> שחקנים זמינים לרכישה</span>
                                <span class="text-xs text-slate-400">תקציב: ₪${state.budget.toLocaleString()}</span>
                            </h4>

                            <div class="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                                ${state.market.map(player => `
                                    <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between hover:border-slate-700 transition">
                                        <div>
                                            <div class="text-sm font-bold text-white">${player.name}</div>
                                            <div class="text-xs text-slate-400">${player.pos} • ${player.clubName} • OVR: <span class="text-amber-400 font-bold">${player.overall}</span></div>
                                            <div class="text-xs text-ea-green font-bold mt-0.5">₪${player.val.toLocaleString()}</div>
                                        </div>

                                        <button onclick="buyPlayer('${player.id}')" class="px-3 py-1.5 bg-ea-green/10 border border-ea-green/40 hover:bg-ea-green hover:text-slate-950 text-ea-green text-xs font-bold rounded-lg transition">
                                            קנה שחקן
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Sell My Players -->
                        <div class="glass-panel p-4 rounded-xl border border-slate-800">
                            <h4 class="font-bold text-red-400 mb-3 flex items-center justify-between">
                                <span><i class="fas fa-dollar-sign ml-1"></i> הסגל שלי למכירה</span>
                                <span class="text-xs text-slate-400">${state.squad.length} שחקנים</span>
                            </h4>

                            <div class="space-y-2 max-h-[500px] overflow-y-auto pr-1">
                                ${state.squad.map(player => `
                                    <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between hover:border-slate-700 transition">
                                        <div>
                                            <div class="text-sm font-bold text-white">${player.name} (#${player.num})</div>
                                            <div class="text-xs text-slate-400">${player.pos} • OVR: <span class="text-amber-400 font-bold">${player.overall}</span></div>
                                            <div class="text-xs text-emerald-400 font-bold mt-0.5">ערך: ₪${player.val.toLocaleString()}</div>
                                        </div>

                                        <button onclick="sellPlayer('${player.id}')" class="px-3 py-1.5 bg-red-500/10 border border-red-500/40 hover:bg-red-500 hover:text-white text-red-400 text-xs font-bold rounded-lg transition">
                                            מכור שחקן
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStandingsTab() {
            return `
                <div class="glass-panel p-5 rounded-xl border border-slate-800">
                    <h3 class="font-bold text-lg text-white mb-4">טבלת ליגת WINNER - עונת 2026/27</h3>

                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs md:text-sm">
                            <thead class="bg-slate-900/80 text-slate-400 uppercase font-bold border-b border-slate-800">
                                <tr>
                                    <th class="p-3">מיקום</th>
                                    <th class="p-3">קבוצה</th>
                                    <th class="p-3">משחקים</th>
                                    <th class="p-3">נצחונות</th>
                                    <th class="p-3">תיקו</th>
                                    <th class="p-3">הפסדים</th>
                                    <th class="p-3">שערי זכות</th>
                                    <th class="p-3">שערי חובה</th>
                                    <th class="p-3">הפרש</th>
                                    <th class="p-3 text-ea-green">נקודות</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60">
                                ${state.standings.map((team, idx) => {
                                    const isUser = team.name === state.userClub.name;
                                    return `
                                        <tr class="${isUser ? 'bg-ea-green/10 font-bold text-white' : 'hover:bg-slate-900/40 text-slate-300'}">
                                            <td class="p-3 font-black">${idx + 1}</td>
                                            <td class="p-3 flex items-center gap-2">
                                                <img src="${team.badge}" class="w-5 h-5 object-contain" alt="">
                                                <span>${team.name} ${isUser ? '(אתה)' : ''}</span>
                                            </td>
                                            <td class="p-3">${team.played}</td>
                                            <td class="p-3 text-emerald-400">${team.wins}</td>
                                            <td class="p-3 text-slate-400">${team.draws}</td>
                                            <td class="p-3 text-red-400">${team.losses}</td>
                                            <td class="p-3">${team.gf}</td>
                                            <td class="p-3">${team.ga}</td>
                                            <td class="p-3">${team.gd > 0 ? '+' + team.gd : team.gd}</td>
                                            <td class="p-3 font-black text-amber-400 text-base">${team.pts}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderMatchTab() {
            const sim = state.matchSim;
            return `
                <div class="max-w-3xl mx-auto glass-panel p-6 rounded-2xl border border-slate-800 text-center">
                    <h3 class="text-xl font-bold text-slate-200 mb-2">סימולציית משחק בלייב - מחזור ${state.currentRound}</h3>
                    <p class="text-xs text-slate-400 mb-6">מנוע המשחק המעודכן - שוערים מוגנים ולא יבקיעו שערים</p>

                    <!-- Scoreboard -->
                    <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 flex items-center justify-between mb-6 shadow-2xl">
                        <div class="flex-1 text-center">
                            <h4 class="font-bold text-lg text-white mb-1">${sim.homeTeam || state.userClub.name}</h4>
                            <span class="text-xs text-slate-400">מארחת</span>
                        </div>

                        <div class="px-6 py-3 bg-slate-900 rounded-xl border border-slate-800 flex items-center gap-4">
                            <span class="text-4xl font-black text-ea-green">${sim.homeGoals}</span>
                            <span class="text-slate-600 font-bold text-xl">:</span>
                            <span class="text-4xl font-black text-ea-green">${sim.awayGoals}</span>
                        </div>

                        <div class="flex-1 text-center">
                            <h4 class="font-bold text-lg text-white mb-1">${sim.awayTeam || 'יריבה באקראי'}</h4>
                            <span class="text-xs text-slate-400">אורחת</span>
                        </div>
                    </div>

                    <!-- Progress / Timer -->
                    <div class="mb-6">
                        <div class="flex justify-between text-xs text-slate-400 mb-1">
                            <span>דקה: ${sim.timer}'</span>
                            <span>${sim.inProgress ? 'משחק באירוע לייב...' : (sim.timer >= 90 ? 'משחק הסתיים' : 'מוכן לשריקת הפתיחה')}</span>
                        </div>
                        <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                            <div class="bg-ea-green h-full transition-all duration-300" style="width: ${(sim.timer / 90) * 100}%"></div>
                        </div>
                    </div>

                    <!-- Action Button -->
                    ${!sim.inProgress ? `
                        <button onclick="startMatchSimulation()" class="w-full py-4 bg-gradient-to-r from-ea-green to-emerald-600 text-slate-950 font-black text-lg rounded-xl hover:opacity-90 transition shadow-lg shadow-emerald-900/30 mb-6">
                            ${sim.timer >= 90 ? 'שחק משחק נוסף' : 'התחל סימולציית משחק'} <i class="fas fa-play mr-2"></i>
                        </button>
                    ` : ''}

                    <!-- Live Commentary Feed -->
                    <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800 text-right h-48 overflow-y-auto space-y-2">
                        <div class="text-xs font-bold text-slate-400 border-b border-slate-800 pb-1 mb-2">אירועי המשחק:</div>
                        ${sim.events.length === 0 ? '<div class="text-xs text-slate-600 text-center py-8">לחץ על הכפתור למעלה כדי להתחיל את המשחק</div>' : ''}
                        ${sim.events.map(e => `
                            <div class="text-xs text-slate-300 p-2 rounded bg-slate-900 border border-slate-800/80">
                                <span class="text-ea-green font-bold ml-2">${e.minute}'</span>
                                <span>${e.text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
